[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kapsel-plugin-autopilot"
version = "0.2.0"
description = "Production process manager and daemon supervisor for Kapsel powered by PM2."
readme = "README.md"
authors = [{ name = "MrEiu" }]
license = { text = "MIT" }
keywords = ["kapsel", "plugin", "autopilot", "pm2", "process-manager", "daemon", "cli"]
dependencies = [
    "rich>=13.0.0",
]

[project.entry-points."kapsel.plugins"]
autopilot = "plugins.autopilot:Plugin"
ap = "plugins.autopilot:Plugin"
