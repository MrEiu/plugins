# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
# Kapsel Carapace Completion Spec (Français)
name: shore
description: Changeur de source miroir rapide et intelligent (propulsé par chsrc)
standalone: true
flags:
  -h, --help: Afficher l'aide
  -v, --version: Afficher la version
commands:
- name: set
  aliases:
  - s
  description: Benchmark automatique et bascule vers la source miroir la plus rapide
  commands:
  - name: python
    description: Index de paquets Python / PyPI
    aliases: &id010
    - py
    commands:
    - &id001
      name: first
      description: Miroir le plus rapide selon les benchmarks des mainteneurs en amont
    - &id002
      name: tuna
      description: Miroir open source de l'Université Tsinghua (TUNA)
    - &id003
      name: aliyun
      description: Miroir open source d'Alibaba Cloud
    - &id004
      name: ustc
      description: Université des sciences et technologies de Chine (USTC)
    - &id005
      name: tencent
      description: Miroir public de Tencent Cloud
    - &id006
      name: huawei
      description: Miroir open source de Huawei Cloud
    - &id007
      name: '163'
      description: Miroir open source de NetEase
    - &id008
      name: bfsu
      description: Miroir de l'Université des langues étrangères de Pékin
    - &id009
      name: sjtu
      description: Miroir de l'Université Jiao Tong de Shanghai
  - name: pip
    description: Installateur de paquets Python pip
    aliases: &id011
    - pip3
    commands:
    - *id001
    - *id002
    - *id003
    - *id004
    - *id005
    - *id006
    - *id007
    - *id008
    - *id009
