# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
# Kapsel Carapace Completion Spec (Deutsch)
name: shore
description: Schneller intelligenter Spiegelquellen-Wechsler (unterstützt von chsrc)
standalone: true
flags:
  -h, --help: Hilfeinformationen anzeigen
  -v, --version: Version anzeigen
commands:
- name: set
  aliases:
  - s
  description: Automatisch benchmarken und zur schnellsten Spiegelquelle wechseln
  commands:
  - name: python
    description: Python-/PyPI-Paketindex
    aliases: &id010
    - py
    commands:
    - &id001
      name: first
      description: Schnellster Spiegel, von Upstream-Maintainern benchmarkt
    - &id002
      name: tuna
      description: Open-Source-Spiegel der Tsinghua-Universität (TUNA)
    - &id003
      name: aliyun
      description: Open-Source-Spiegel der Alibaba Cloud
    - &id004
      name: ustc
      description: Universität für Wissenschaft und Technologie Chinas (USTC)
    - &id005
      name: tencent
      description: Öffentlicher Spiegel der Tencent Cloud
    - &id006
      name: huawei
      description: Open-Source-Spiegel der Huawei Cloud
    - &id007
      name: '163'
      description: Open-Source-Spiegel von NetEase
    - &id008
      name: bfsu
      description: Spiegel der Fremdsprachenuniversität Peking
    - &id009
      name: sjtu
      description: Spiegel der Shanghai-Jiao-Tong-Universität
  - name: pip
    description: Python-pip-Paketinstallationsprogramm
    aliases: &id011
    - pip3
