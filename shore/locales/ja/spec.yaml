# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
# Kapsel Carapace Completion Spec (日本語)
name: shore
description: 快速智能镜像源切换器（由chsrc驱动）
standalone: true
flags:
  -h, --help: 显示帮助信息
  -v, --version: 显示版本
commands:
- name: set
  aliases:
  - s
  description: 自动基准测试并切换到最快的镜像源
  commands:
  - name: python
    description: Python / PyPI包索引
    aliases: &id010
    - py
    commands:
