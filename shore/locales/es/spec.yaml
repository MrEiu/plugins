      name: first
      description: Espejo más rápido evaluado por los mantenedores ascendentes
    - &id002
      name: tuna
      description: Espejo de código abierto de la Universidad de Tsinghua (TUNA)
    - &id003
      name: aliyun
      description: Espejo de código abierto de Alibaba Cloud
    - &id004
      name: ustc
      description: Universidad de Ciencia y Tecnología de China (USTC)
    - &id005
      name: tencent
      description: Espejo público de Tencent Cloud
    - &id006
      name: huawei
      description: Espejo de código abierto de Huawei Cloud
    - &id007
      name: '163'
      description: Espejo de código abierto de NetEase
    - &id008
      name: bfsu
      description: Espejo de la Universidad de Estudios Extranjeros de Beijing
    - &id009
      name: sjtu
      description: Espejo de la Universidad Jiao Tong de Shanghái
