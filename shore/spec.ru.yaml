# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
# Kapsel Carapace Completion Spec (Русский)
name: shore
description: Быстрый интеллектуальный переключатель зеркальных источников (на базе
  chsrc)
standalone: true
flags:
  -h, --help: Показать справочную информацию
  -v, --version: Показать версию
commands:
- name: set
  aliases:
  - s
  description: Автоматическое тестирование и переключение на самый быстрый зеркальный
    источник
  commands:
  - name: python
    description: Индекс пакетов Python / PyPI
    aliases: &id010
    - py
    commands:
    - &id001
      name: first
      description: Самое быстрое зеркало по результатам тестов вышестоящих разработчиков
    - &id002
      name: tuna
      description: Зеркало открытого ПО Университета Цинхуа (TUNA)
    - &id003
      name: aliyun
      description: Зеркало открытого ПО Alibaba Cloud
    - &id004
      name: ustc
      description: Университет науки и технологий Китая (USTC)
    - &id005
      name: tencent
      description: Публичное зеркало Tencent Cloud
    - &id006
      name: huawei
      description: Зеркало открытого ПО Huawei Cloud
    - &id007
      name: '163'
      description: Зеркало открытого ПО NetEase
    - &id008
      name: bfsu
      description: Зеркало Пекинского университета иностранных языков
    - &id009
      name: sjtu
      description: Зеркало Шанхайского университета Цзяотун
  - name: pip
    description: Установщик пакетов Python pip
    aliases: &id011
    - pip3
    commands:
    - *id001
    - *id002
    - *id003
    - *id004
    - *id005
    - *id006
    - *id007
    - *id008
    - *id009
  - name: uv
    description: Быстрый менеджер пакетов и проектов Python (Astral uv)
    commands:
    - *id001
    - *id002
    - *id003
    - *id004
    - *id005
    - *id006
    - *id007
    - *id008
    - *id009
  - name: poetry
    description: Управление упаковкой и зависимостями Python
