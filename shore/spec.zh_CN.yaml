# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
# Kapsel Carapace Completion Spec (简体中文)
name: shore
description: 快速智能镜像源切换器（由chsrc驱动）
standalone: true
flags:
  -h, --help: 显示帮助信息
  -v, --version: 显示版本
commands:
- name: set
  aliases:
  - s
  description: 自动基准测试并切换到最快的镜像源
  commands:
  - name: python
    description: Python / PyPI包索引
    aliases: &id010
    - py
    commands:
    - &id001
      name: first
      description: 由上游维护者基准测试的最快镜像
    - &id002
      name: tuna
      description: 清华大学开源软件镜像站（TUNA）
    - &id003
      name: aliyun
      description: 阿里云开源镜像站
    - &id004
      name: ustc
      description: 中国科学技术大学开源软件镜像（USTC）
    - &id005
      name: tencent
      description: 腾讯云公共镜像
    - &id006
      name: huawei
      description: 华为云开源镜像站
    - &id007
      name: '163'
      description: 网易开源镜像站
    - &id008
      name: bfsu
      description: 北京外国语大学镜像站
    - &id009
      name: sjtu
      description: 上海交通大学镜像站
  - name: pip
    description: Python pip 包安装器
    aliases: &id011
    - pip3
    commands:
    - *id001
    - *id002
    - *id003
    - *id004
    - *id005
    - *id006
    - *id007
    - *id008
    - *id009
