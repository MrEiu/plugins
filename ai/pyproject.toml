[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kapsel-plugin-ai"
version = "0.1.2"
description = "Native terminal AI assistant plugin for Kapsel powered by OpenAI Python SDK with guided setup wizard."
authors = [{ name = "Kapsel Team" }]
license = { text = "MIT" }
dependencies = [
    "pyyaml",
    "openai>=1.0.0",
]
keywords = ["kapsel", "plugin", "ai", "llm", "copilot", "deepseek", "openai", "cli"]

[project.urls]
Homepage = "https://github.com/MrEiu/plugins/tree/master/ai"
Repository = "https://github.com/MrEiu/plugins.git"
