[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kapsel-plugin-rec"
version = "0.1.0"
description = "Command snippet recording and execution manager for Kapsel shell powered by pet."
authors = [{ name = "Kapsel Team" }]
license = { text = "MIT" }
dependencies = []
keywords = ["kapsel", "plugin", "snippets", "pet", "cli"]

[project.urls]
Homepage = "https://github.com/MrEiu/plugins/tree/master/rec"
Repository = "https://github.com/MrEiu/plugins.git"
