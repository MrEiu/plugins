[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kapsel-plugin-profile"
version = "0.1.0"
description = "Cross-platform dotfile and profile management plugin for Kapsel powered by chezmoi."
authors = [{ name = "Kapsel Team" }]
license = { text = "MIT" }
dependencies = []
keywords = ["kapsel", "plugin", "profile", "dotfiles", "chezmoi", "sync"]

[project.urls]
Homepage = "https://github.com/MrEiu/plugins/tree/master/profile"
Repository = "https://github.com/MrEiu/plugins.git"
