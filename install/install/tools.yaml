tools:
  meta-package-manager:
    name: "meta-package-manager"
    description: "CLI wrapper for multi package managers"
    bin: "mpm"
    platforms:
      windows:
        strategy:
          - type: "os"
            manager: "scoop"
            pkg: "main/meta-package-manager"
          - type: "python"
            manager: "pip"
            pkg: "meta-package-manager"
          - type: "binary"
            url: "https://github.com/kdeldycke/meta-package-manager/releases/latest/download/meta-package-manager-windows-x64.exe"
            dest: "~/.kapsel/bin/mpm.exe"
      macos:
        strategy:
          - type: "os"
            manager: "brew"
            pkg: "meta-package-manager"
          - type: "python"
            manager: "pip"
            pkg: "meta-package-manager"
          - type: "binary"
            url: "https://github.com/kdeldycke/meta-package-manager/releases/latest/download/meta-package-manager-macos-x64.bin"
            dest: "~/.kapsel/bin/mpm"
      linux:
        strategy:
          - type: "os"
            manager: "brew"
            pkg: "meta-package-manager"
          - type: "python"
            manager: "pip"
            pkg: "meta-package-manager"
          - type: "binary"
            url: "https://github.com/kdeldycke/meta-package-manager/releases/latest/download/meta-package-manager-linux-x64.bin"
            dest: "~/.kapsel/bin/mpm"
