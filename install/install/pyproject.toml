[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kapsel-plugin-install"
version = "0.1.0"
description = "Official Kapsel install plugin bridging meta-package-manager (mpm) for cross-platform package management."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Kapsel Team" }
]
dependencies = [
    "meta-package-manager>=5.0.0"
]
keywords = ["kapsel", "plugin", "install", "mpm", "package-manager", "cli", "cross-platform"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities"
]

[project.urls]
Homepage = "https://github.com/kapsel-shell/kapsel-plugin-install"
Repository = "https://github.com/kapsel-shell/kapsel-plugin-install"
Issues = "https://github.com/kapsel-shell/kapsel-plugin-install/issues"
