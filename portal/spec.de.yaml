# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
# Kapsel Carapace Completion Spec (Deutsch)
name: portal
description: Intelligente Verzeichnis-Teleportation und Arbeitsbereichsnavigation
  (unterstützt von zoxide)
standalone: true
flags:
  -h, --help: Hilfeinformationen anzeigen
commands:
- name: ls
  aliases:
  - list
  description: Rangierte Verzeichnisse und Frecency-Werte auflisten
  flags:
    -s, --score: Punktzahl mit Ergebnissen ausgeben
- name: add
  aliases:
  - +
  description: 'Verzeichnis zur Datenbank hinzufügen (Standard: aktuelles Verzeichnis)'
- name: rm
  aliases:
  - remove
  - '-'
  description: Verzeichnis aus Datenbank entfernen
- name: query
  description: In Datenbank nach Verzeichnis suchen
- name: open
  aliases:
  - explore
  description: Verzeichnis im nativen Datei-Explorer öffnen
- name: doctor
  description: zoxide-Installation und Umgebung diagnostizieren
- name: edit
  description: zoxide-Datenbank direkt bearbeiten
- name: init
  description: Externe Shell-Hook-Konfiguration generieren
- name: hook
  description: Verzeichnisgebundene Initialisierungs-Hooks (.portal) verwalten
  commands:
  - name: status
    aliases:
    - cat
    - show
    description: Status und Befehle des .portal-Hooks im aktuellen Verzeichnis anzeigen
  - name: init
    aliases:
    - create
    - new
    description: .portal-Hook-Vorlage im aktuellen Verzeichnis erstellen
  - name: edit
    aliases:
    - open
    description: .portal im externen Editor öffnen
  - name: run
    aliases:
    - exec
    description: .portal-Befehle sofort ausführen
  - name: rm
    aliases:
    - remove
    - del
    - delete
    description: .portal-Hook-Datei aus aktuellem Verzeichnis löschen
