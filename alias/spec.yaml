# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: alias
description: "Cross-platform command alias translation and mapping"
standalone: false

flags:
  -h, --help: "Show help information"

commands:
  - name: list
    aliases: ["ls"]
    description: "List all active command mappings"
    flags:
      -j, --json: "Output mappings formatted as JSON"
  - name: add
    description: "Add a new command alias mapping"
    flags:
      -f, --from=: "Source universal command name (e.g. ll, rm, cat)"
      -t, --to=: "Target host shell command template (e.g. Get-ChildItem)"
      -s, --shell=: "Target shell filter (pwsh|cmd|bash|zsh)"
      -g, --global: "Persist mapping to global user data directory"
  - name: remove
    aliases: ["rm", "delete"]
    description: "Remove an existing alias mapping"
    flags:
      -f, --from=: "Alias name to remove"
  - name: test
    description: "Dry-run and inspect command translation without execution"
  - name: reset
    description: "Reset mappings to built-in defaults"
    flags:
      --force: "Bypass confirmation prompt"
