# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: alias
description: "Cross-platform command alias mapping and ultra modern CLI tools management"
standalone: false

flags:
  -h, --help: "Show help information"

commands:
  - name: list
    aliases: ["ls"]
    description: "Display registered alias mappings and ultra modern tools status"
    flags:
      -p, --platform=: "Filter mappings by target shell platform"
    completion:
      flag:
        platform: ["universal\tAll platforms", "pwsh\tPowerShell 7+", "cmd\tWindows CMD", "bash\tGNU Bash", "zsh\tZ Shell", "powershell\tWindows PowerShell"]

  - name: add
    description: "Add or update a command alias mapping (default current platform)"
    flags:
      -p, --platform=: "Target shell platform (default active shell)"
      -d, --desc=: "Human-readable description for the alias"
    completion:
      flag:
        platform: ["universal\tAll platforms", "pwsh\tPowerShell 7+", "cmd\tWindows CMD", "bash\tGNU Bash", "zsh\tZ Shell", "powershell\tWindows PowerShell"]

  - name: remove
    aliases: ["rm", "delete"]
    description: "Remove an alias or specific platform template"
    flags:
      -p, --platform=: "Remove only specified platform template"
    completion:
      flag:
        platform: ["universal\tAll platforms", "pwsh\tPowerShell 7+", "cmd\tWindows CMD", "bash\tGNU Bash", "zsh\tZ Shell", "powershell\tWindows PowerShell"]

  - name: test
    description: "Preview command translation across shell platforms without executing"

  - name: reset
    description: "Reset all mappings to 36+ Linux-First baseline defaults"
    flags:
      --hard: "Completely overwrite all custom aliases"

  - name: ultra
    description: "One-click install modern high-performance CLI tools (eza, bat, rg, fd, procs, dust, etc.)"
    flags:
      -n, --dry-run: "Simulate installation without making system changes"
      --force: "Force reinstall all ultra modern tools"
