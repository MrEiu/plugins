# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: alias
description: "Multi-terminal and cross-platform command alias mapping (translating universal Linux aliases to host shell commands)"
flags:
  -h, --help: "Show help information"
commands:
  - name: list
    aliases: ["ls"]
    description: "List active aliases for current host shell"
    flags:
      -v, --verbose: "Display complete command templates"
      -a, --all: "Display mappings across all shell families"
  - name: test
    description: "Preview translated command without executing it"
    flags:
      -s, --shell=: "Target shell family to test against (pwsh, cmd, unix)"
  - name: add
    description: "Add or update a custom command alias mapping"
    flags:
      -d, --desc=: "Custom description for the alias"
      -s, --shell=: "Specific target shell family (default: active shell)"
  - name: remove
    aliases: ["rm", "delete"]
    description: "Remove a custom or baseline alias mapping"
  - name: reset
    description: "Reset all alias mappings back to baseline defaults"
    flags:
      -f, --force: "Force reset without confirmation prompt"
